<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./img/pokeball.png">
  <title>Pokedex Project</title>
</head>

<body>
  <div class="bg">
    <div class="logo">
      <img src="./img/logo.svg" alt="">
    </div>
    <div class="card grass">
      <div class="uppercard">
        <h2 class="name">Loading…</h2>
        <div class="numbertype">
          <p class="number">#</p>
          <div class="types"></div>
        </div>
        <img class="image" src="./img/Bulbasaur.png" alt="pokemon image">
      </div>
      <div class="lowercard">
        <div class="statusBG">
          <p class="smallTitle">Stats</p>
          <ul class="status"></ul>
        </div>
        <div class="movesBG">
          <p class="smallTitle">Moves</p>
          <ul class="moves"></ul>
        </div>
      </div>
    </div>
    <div class="bgMenu">
      <div class="searchBox">
        <input type="search" id="search" placeholder="Search by name or number">
      </div>
      <ul class="menu"></ul>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
