<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./img/pokeball.png">
  <title>Pokedex Project</title>
</head>

<body>
  <div class="bg">
    <div class="logo">
      <img src="./img/logo.svg" alt="Pokémon">
    </div>

    <div class="stage">
      <div class="pokedex closed">

        <div class="half left">
          <div class="topbar">
            <div class="lens"></div>
            <div class="lights">
              <span class="light red"></span>
              <span class="light yellow"></span>
              <span class="light green"></span>
            </div>
            <button class="closeDex" title="Close the Pokédex">✕</button>
          </div>
          <div class="screen listScreen">
            <div class="searchBox">
              <input type="search" id="search" placeholder="Search by name or number" autocomplete="off" data-1p-ignore data-lpignore="true">
            </div>
            <p class="noResults" hidden>No Pokémon found</p>
            <ul class="menu"></ul>
          </div>
        </div>

        <div class="half right">
          <div class="face infoFace">
            <nav class="appMenu">
              <button class="appBtn active" data-app="dex">📱<span>Dex</span></button>
              <button class="appBtn" data-app="quiz">❓<span>Quiz</span></button>
              <button class="appBtn" data-app="team">👥<span>Team</span></button>
              <button class="appBtn" data-app="compare">⚖️<span>Compare</span></button>
              <button class="appBtn randomBtn" type="button">🎲<span>Random</span></button>
            </nav>
            <div class="screen infoScreen">
              <div class="screenBody infoBody">
                <div class="placeholder">Choose a Pokémon!</div>
                <div class="details" hidden>
                  <div class="detailsTop">
                    <div class="numbertype">
                      <p class="number">#</p>
                      <div class="types"></div>
                    </div>
                    <h2 class="name"></h2>
                    <p class="genus"></p>
                    <div class="artworkBox">
                      <img class="image" alt="">
                      <div class="artButtons">
                        <button class="iconBtn shinyBtn" title="Toggle shiny">✨</button>
                        <button class="iconBtn cryBtn" title="Play cry">🔊</button>
                        <button class="iconBtn teamBtn" title="Add to team"><img src="./img/pokeball.png" alt="Team"></button>
                      </div>
                    </div>
                  </div>
                  <nav class="tabs">
                    <button class="tab active" data-tab="about">ℹ️<span>About</span></button>
                    <button class="tab" data-tab="stats">📊<span>Stats</span></button>
                    <button class="tab" data-tab="moves">⚔️<span>Moves</span></button>
                    <button class="tab" data-tab="evolution">🧬<span>Evolution</span></button>
                    <button class="tab" data-tab="more">📖<span>More</span></button>
                  </nav>
                  <section class="tabPanel" data-panel="about"></section>
                  <section class="tabPanel" data-panel="stats" hidden></section>
                  <section class="tabPanel" data-panel="moves" hidden></section>
                  <section class="tabPanel" data-panel="evolution" hidden></section>
                  <section class="tabPanel" data-panel="more" hidden></section>
                </div>
              </div>

              <div class="screenBody quizBody" hidden>
                <h3 class="appTitle">Who's that Pokémon?</h3>
                <div class="quizImageBox"><img class="quizImage" alt="Who's that Pokémon?"></div>
                <form class="quizForm">
                  <input class="quizInput" type="text" placeholder="Your guess…" autocomplete="off" data-1p-ignore data-lpignore="true">
                  <button type="submit" class="quizGuess">Guess</button>
                </form>
                <p class="quizFeedback"></p>
                <div class="quizActions">
                  <button type="button" class="quizReveal">Reveal</button>
                  <button type="button" class="quizNext" hidden>Next</button>
                </div>
                <p class="quizScore"></p>
              </div>

              <div class="screenBody teamBody" hidden>
                <h3 class="appTitle">My Team</h3>
                <p class="appHint">Click Pokémon in the list to add them (up to 6). Click ✕ to remove.</p>
                <ul class="teamSlots"></ul>
                <p class="teamTotal"></p>
              </div>

              <div class="screenBody compareBody" hidden>
                <h3 class="appTitle">Compare</h3>
                <p class="appHint">Click two Pokémon in the list to compare them.</p>
                <div class="compareHeads"></div>
                <ul class="compareStats"></ul>
              </div>
            </div>
          </div>
          <div class="face cover">
            <div class="lens"></div>
            <div class="lights">
              <span class="light red"></span>
              <span class="light yellow"></span>
              <span class="light green"></span>
            </div>
            <p class="hint">Click to open</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
